name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  guard:
    name: guard (spec lock + layers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/spec-guard.mjs verify
      - run: node tools/layers-check.mjs
      - name: locked files need a CR id
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/spec-guard.mjs pr ${{ github.event.pull_request.base.sha }}
